name: ML prediction + GitHub Pages

"on":
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'scripts/ml_predict.py'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-prediction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'scripts/ml_predict.py'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-prediction.yml'
  schedule:
    # 00:30 UTC Tue-Sat, after the prior U.S. regular session.
    - cron: '30 0 * * 2-6'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-truth-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt

      - name: Validate Python
        run: python -m py_compile scripts/ml_predict.py

      - name: Build leakage-aware ML snapshots
        run: python scripts/ml_predict.py --data-dir docs/data --output-dir docs/data/ml

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json, pathlib
          files = sorted(pathlib.Path('docs/data/ml').glob('*.json'))
          assert files, 'no ML JSON files were generated'
          for p in files:
              json.loads(p.read_text())
          print(f'validated {len(files)} JSON files')
          PY

      - name: Security scan dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s=Path('docs/index.html').read_text(encoding='utf-8')
          banned=[
            r'type=["\']password["\']', r'api\.twelvedata\.com', r'finnhub\.io/api',
            r'api\.polygon\.io', r'alphavantage\.co/query', r'financialmodelingprep\.com',
            r'localStorage[^\n]{0,120}(key|token)', r'prompt\([^\n]{0,120}(key|token)'
          ]
          hits=[p for p in banned if re.search(p,s,re.I)]
          assert not hits, f'public dashboard contains browser-side secret/API paths: {hits}'
          print('dashboard security scan passed')
          PY

  deploy:
    if: github.event_name != 'pull_request'
    needs: validate-model
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt

      - name: Build final ML snapshots
        run: python scripts/ml_predict.py --data-dir docs/data --output-dir docs/data/ml

      - name: Commit changed prediction snapshots
        run: |
          if git diff --quiet -- docs/data/ml; then
            echo 'No ML changes to commit.'
          else
            git config user.name 'stock-truth-robot'
            git config user.email 'stock-truth-robot@users.noreply.github.com'
            git add docs/data/ml
            git commit -m 'data: update walk-forward ML snapshots'
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
