<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Stock Truth V4.1 — Local Multi-Horizon + Swing</title>
<style>
body{margin:0;background:#101216;color:#E8E5DD;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}.box{max-width:800px;padding:28px}.muted{color:#8C909A;font-size:14px;line-height:1.6}.err{color:#E05252;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h2>Loading Stock Truth V4.1…</h2><div class="muted">Browser-local predictive model · uses already-loaded any-ticker completed bars · 1D · 1W · 1M · 1Y · swing · entry zone · T1/T2 · invalidation · historical target-hit rates · no older predictive fallback</div></div>
<script>
(async()=>{
  const stamp=Date.now();
  const src='https://raw.githubusercontent.com/samin110597-create/stock-truth/main/docs/v2/index.html?v='+stamp;
  const r=await fetch(src,{cache:'no-store'});
  if(!r.ok)throw new Error('V4.1 base loader HTTP '+r.status);
  let page=await r.text();
  page=page.replaceAll('Loading Stock Truth v2…','Loading Stock Truth V4.1…');
  page=page.replaceAll('Stock Truth v2 could not load','Stock Truth V4.1 could not load');
  page=page.replaceAll('v3-upgrade.js','v4-bootstrap.js');
  page=page.replaceAll('Institutional technical terminal · secure any-ticker data · 10-quarter fundamentals · walk-forward forecasts','V4.1 local multi-horizon + swing terminal · 1D / 1W / 1M / 1Y · entry / targets / invalidation · verified vs unverified evidence');
  document.open();document.write(page);document.close();
})().catch(err=>{
  const msg=String(err&&err.message||err).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));
  document.body.innerHTML='<div class="box"><h2>Stock Truth V4.1 could not load</h2><div class="muted err">'+msg+'</div><p class="muted"><b>No older predictive version is loaded as fallback.</b></p></div>';
});
</script>
</body>
</html>
