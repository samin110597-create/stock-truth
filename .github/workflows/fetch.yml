name: Fetch market data + deploy Pages

"on":
  schedule:
    # Frequent snapshots during the U.S. trading-day window, Mon-Fri.
    # GitHub cron is UTC; the script still reports actual market status.
    - cron: "0,30 13-20 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: stock-truth-fetch-pages
  cancel-in-progress: true

jobs:
  fetch-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install data dependencies
        run: pip install -r requirements.txt

      - name: Fetch and build data
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          FMP_KEY: ${{ secrets.FMP_KEY }}
          POLYGON_KEY: ${{ secrets.POLYGON_KEY }}
          ALPHAVANTAGE_KEY: ${{ secrets.ALPHAVANTAGE_KEY }}
        run: python scripts/fetch_data.py

      - name: Commit updated public snapshots
        run: |
          git config user.name "stock-truth-data-bot"
          git config user.email "stock-truth-data-bot@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No data changes to commit"
          else
            git commit -m "data: $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
