<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">

<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Archivo:wght@400;500;600;700&display=swap');
:root{--bg:#101216;--panel:#181B21;--edge:#282C34;--ink:#E8E5DD;--dim:#8C909A;
--faint:#5E626C;--live:#E8A33D;--up:#4CAF7D;--down:#E05252;--blue:#7A9BC4;--violet:#9B87C4;
--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--sans:'Archivo',system-ui,sans-serif;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
padding:16px clamp(10px,3vw,32px) 60px;font-size:14px}
main{max-width:1180px;margin:0 auto;display:grid;gap:12px}
h1{font-size:19px;margin:0;letter-spacing:.01em}
h2{margin:0 0 10px;font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--dim);
text-transform:uppercase;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
h3{margin:14px 0 8px;font-size:12px;font-weight:600;letter-spacing:.08em;color:var(--blue);text-transform:uppercase}
.panel{background:var(--panel);border:1px solid var(--edge);border-radius:6px;padding:14px}
.sub{font-family:var(--mono);font-size:11px;color:var(--faint)}
.note{font-size:11px;color:var(--faint);margin:9px 0 0;line-height:1.6}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.06em;color:var(--live);
border:1px solid rgba(232,163,61,.3);padding:2px 6px;border-radius:3px;
background:rgba(232,163,61,.07);white-space:nowrap}
.tag.bad{color:var(--down);border-color:rgba(224,82,82,.3);background:rgba(224,82,82,.07)}
.tag.good{color:var(--up);border-color:rgba(76,175,125,.3);background:rgba(76,175,125,.07)}
.hdr{border:1px solid rgba(232,163,61,.35);background:rgba(232,163,61,.045);border-radius:6px;
padding:12px;font-family:var(--mono);font-size:11.5px;line-height:1.75}
.hdr .t{color:var(--live);font-size:10px;letter-spacing:.18em;margin-bottom:5px}
.err{color:var(--down)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(310px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.stats{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(125px,1fr))}
.st .l{font-size:10.5px;color:var(--faint);margin-bottom:2px}
.st .v{font-family:var(--mono);font-size:14.5px;font-weight:500}
.st .s{font-family:var(--mono);font-size:9.5px;color:var(--faint);margin-top:2px}
.up{color:var(--up)}.down{color:var(--down)}.blue{color:var(--blue)}.amber{color:var(--live)}
.violet{color:var(--violet)}.dim{color:var(--dim)}
.price{font-family:var(--mono);font-size:32px;font-weight:600}
input[type=text],input[type=password]{background:var(--bg);border:1px solid var(--edge);
border-radius:4px;color:var(--ink);font-family:var(--mono);font-size:13px;padding:8px 10px;width:100%}
input:focus{outline:none;border-color:var(--live)}
input[type=range]{accent-color:var(--live);width:100%;padding:0}
button{font-family:var(--sans);font-size:12.5px;padding:7px 13px;border-radius:4px;
border:1px solid var(--edge);background:var(--panel);color:var(--dim);cursor:pointer}
button:hover{border-color:var(--dim)}
button.go{background:var(--live);color:#17120A;border:none;font-weight:600;padding:8px 18px}
button.on{border-color:var(--live);color:var(--live);background:rgba(232,163,61,.08)}
button:focus-visible,input:focus-visible{outline:2px solid var(--live);outline-offset:1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--edge);padding-bottom:10px}
.tabs button{font-family:var(--mono);letter-spacing:.06em}
table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px}
th{font-family:var(--sans);font-size:9.5px;color:var(--faint);text-align:left;
text-transform:uppercase;letter-spacing:.1em;padding:5px 8px 5px 0;font-weight:600}
td{padding:5px 8px 5px 0;border-top:1px solid var(--edge);vertical-align:top}
.bar{height:6px;border-radius:3px;background:var(--edge);overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;border-radius:3px}
.big{font-family:var(--mono);font-size:26px;font-weight:600}
.verdictline{font-family:var(--mono);font-size:15px;padding:9px 0}
.ev{display:flex;justify-content:space-between;gap:10px;padding:5px 0;
border-bottom:1px solid var(--edge);font-size:12px;align-items:baseline}
.ev .w{font-family:var(--mono);font-size:10px;color:var(--faint);white-space:nowrap}
.pill{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:9px;white-space:nowrap}
.pill.b{background:rgba(76,175,125,.14);color:var(--up)}
.pill.r{background:rgba(224,82,82,.14);color:var(--down)}
.pill.n{background:rgba(140,144,154,.14);color:var(--dim)}
.pulse{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
details{border-top:1px solid var(--edge);padding-top:8px;margin-top:8px}
summary{cursor:pointer;font-size:11px;color:var(--dim);font-family:var(--mono)}
.kwrap{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(155px,1fr))}
.kwrap label{font-size:10px;color:var(--faint);display:block;margin-bottom:3px}
</style>

<body>
<main>
  <header class="row" style="justify-content:space-between">
    <div class="row" style="gap:12px">
      <h1>Stock Truth</h1>
      <span class="sub">five vendors · verified maths · no simulated numbers</span>
    </div>
    <span class="sub" id="quota"></span>
  </header>

  <div class="panel">
    <h2>Keys <span class="tag">STORED IN THIS BROWSER ONLY</span></h2>
    <div class="kwrap">
      <div><label for="kFinn">Finnhub — quote, profile, analysts</label><input id="kFinn" type="password" placeholder="finnhub"></div>
      <div><label for="kTwelve">Twelve Data — candles</label><input id="kTwelve" type="password" placeholder="twelve data"></div>
      <div><label for="kFmp">FMP — statements</label><input id="kFmp" type="password" placeholder="fmp"></div>
      <div><label for="kPoly">Polygon — candle cross-check</label><input id="kPoly" type="password" placeholder="polygon"></div>
      <div><label for="kAv">Alpha Vantage — earnings, macro</label><input id="kAv" type="password" placeholder="alpha vantage"></div>
    </div>
    <div class="row" style="margin-top:10px">
      <div style="flex:1;min-width:180px"><input id="sym" type="text" placeholder="Any ticker — AAPL, VOO, XIC.TO…" autocomplete="off" spellcheck="false"></div>
      <button class="go" id="btnGo">Analyze</button>
      <button id="btnLive">Go live (10s)</button>
    </div>
    <div class="row" style="margin-top:9px" id="recents"></div>
    <p class="note">Each key is sent only to the vendor it belongs to, straight from this browser. Leave any blank — the panels that need it will name what's missing instead of filling in.</p>
  </div>

  <div id="app"></div>
</main>
<script>
/* ============================================================
   ANALYTICS ENGINE — every function takes real candles or real
   statements and returns numbers. Nothing here invents data;
   where a value cannot be computed it returns null and the UI
   says so. Extracted here so it can be unit-tested.
   ============================================================ */

/* ---------- moving averages ---------- */
function sma(v,p){const o=Array(v.length).fill(null);let s=0;
  for(let i=0;i<v.length;i++){s+=v[i];if(i>=p)s-=v[i-p];if(i>=p-1)o[i]=s/p;}return o;}
function ema(v,p){const o=Array(v.length).fill(null),k=2/(p+1);let pr=null;
  for(let i=0;i<v.length;i++){
    if(i===p-1){pr=v.slice(0,p).reduce((a,b)=>a+b,0)/p;o[i]=pr;}
    else if(i>=p){pr=v[i]*k+pr*(1-k);o[i]=pr;}}return o;}

/* ---------- oscillators ---------- */
function rsi(c,p=14){const o=Array(c.length).fill(null);let g=0,l=0;
  for(let i=1;i<c.length;i++){const d=c[i]-c[i-1];
    if(i<=p){if(d>0)g+=d;else l-=d;
      if(i===p){g/=p;l/=p;o[i]=100-100/(1+(l===0?1e9:g/l));}}
    else{g=(g*(p-1)+Math.max(d,0))/p;l=(l*(p-1)+Math.max(-d,0))/p;
      o[i]=100-100/(1+(l===0?1e9:g/l));}}return o;}

function macd(c,f=12,s=26,sig=9){const ef=ema(c,f),es=ema(c,s);
  const line=c.map((_,i)=>ef[i]!=null&&es[i]!=null?ef[i]-es[i]:null);
  const val=line.filter(x=>x!=null),sv=ema(val,sig);
  const signal=Array(line.length).fill(null);let j=0;
  for(let i=0;i<line.length;i++)if(line[i]!=null)signal[i]=sv[j++];
  const hist=line.map((x,i)=>x!=null&&signal[i]!=null?x-signal[i]:null);
  return{line,signal,hist};}

function stoch(bars,p=14,sp=3){const k=Array(bars.length).fill(null);
  for(let i=p-1;i<bars.length;i++){const w=bars.slice(i-p+1,i+1);
    const hh=Math.max(...w.map(b=>b.high)),ll=Math.min(...w.map(b=>b.low));
    k[i]=hh===ll?50:((bars[i].close-ll)/(hh-ll))*100;}
  const kv=k.filter(x=>x!=null),dv=sma(kv,sp);
  const d=Array(k.length).fill(null);let j=0;
  for(let i=0;i<k.length;i++)if(k[i]!=null)d[i]=dv[j++];
  return{k,d};}

function williamsR(bars,p=14){const o=Array(bars.length).fill(null);
  for(let i=p-1;i<bars.length;i++){const w=bars.slice(i-p+1,i+1);
    const hh=Math.max(...w.map(b=>b.high)),ll=Math.min(...w.map(b=>b.low));
    o[i]=hh===ll?-50:((hh-bars[i].close)/(hh-ll))*-100;}return o;}

function cci(bars,p=20){const o=Array(bars.length).fill(null);
  const tp=bars.map(b=>(b.high+b.low+b.close)/3),m=sma(tp,p);
  for(let i=p-1;i<bars.length;i++){
    const md=tp.slice(i-p+1,i+1).reduce((a,v)=>a+Math.abs(v-m[i]),0)/p;
    o[i]=md===0?0:(tp[i]-m[i])/(0.015*md);}return o;}

function mfi(bars,p=14){const o=Array(bars.length).fill(null);
  const tp=bars.map(b=>(b.high+b.low+b.close)/3);
  for(let i=p;i<bars.length;i++){let pos=0,neg=0;
    for(let j=i-p+1;j<=i;j++){const f=tp[j]*(bars[j].volume||0);
      if(tp[j]>tp[j-1])pos+=f;else if(tp[j]<tp[j-1])neg+=f;}
    o[i]=neg===0?100:100-100/(1+pos/neg);}return o;}

function roc(c,p=20){return c.map((v,i)=>i>=p&&c[i-p]?((v-c[i-p])/c[i-p])*100:null);}

/* ---------- volatility / range ---------- */
function trueRanges(bars){return bars.map((b,i)=>i===0?b.high-b.low:
  Math.max(b.high-b.low,Math.abs(b.high-bars[i-1].close),Math.abs(b.low-bars[i-1].close)));}

function atr(bars,p=14){const t=trueRanges(bars),o=Array(bars.length).fill(null);let pr=null;
  for(let i=0;i<t.length;i++){
    if(i===p-1){pr=t.slice(0,p).reduce((a,b)=>a+b,0)/p;o[i]=pr;}
    else if(i>=p){pr=(pr*(p-1)+t[i])/p;o[i]=pr;}}return o;}

function adx(bars,p=14){const n=bars.length;
  const pdm=Array(n).fill(0),ndm=Array(n).fill(0),tr=trueRanges(bars);
  for(let i=1;i<n;i++){const up=bars[i].high-bars[i-1].high,dn=bars[i-1].low-bars[i].low;
    pdm[i]=(up>dn&&up>0)?up:0;ndm[i]=(dn>up&&dn>0)?dn:0;}
  const wilder=(a)=>{const o=Array(n).fill(null);let s=null;
    for(let i=0;i<n;i++){if(i===p){s=a.slice(1,p+1).reduce((x,y)=>x+y,0);o[i]=s;}
      else if(i>p){s=s-s/p+a[i];o[i]=s;}}return o;};
  const str=wilder(tr),sp=wilder(pdm),sn=wilder(ndm);
  const pdi=Array(n).fill(null),ndi=Array(n).fill(null),dx=Array(n).fill(null);
  for(let i=0;i<n;i++)if(str[i]&&str[i]!==0){
    pdi[i]=100*sp[i]/str[i];ndi[i]=100*sn[i]/str[i];
    const s=pdi[i]+ndi[i];dx[i]=s===0?0:100*Math.abs(pdi[i]-ndi[i])/s;}
  const out=Array(n).fill(null);const dv=dx.map((x,i)=>({x,i})).filter(o2=>o2.x!=null);
  if(dv.length>=p){let s=dv.slice(0,p).reduce((a,o2)=>a+o2.x,0)/p;out[dv[p-1].i]=s;
    for(let j=p;j<dv.length;j++){s=(s*(p-1)+dv[j].x)/p;out[dv[j].i]=s;}}
  return{adx:out,pdi,ndi};}

function bollinger(c,p=20,m=2){const mid=sma(c,p),n=c.length;
  const up=Array(n).fill(null),lo=Array(n).fill(null),bw=Array(n).fill(null),pb=Array(n).fill(null);
  for(let i=p-1;i<n;i++){const w=c.slice(i-p+1,i+1);
    const sd=Math.sqrt(w.reduce((a,v)=>a+(v-mid[i])**2,0)/p);
    up[i]=mid[i]+m*sd;lo[i]=mid[i]-m*sd;
    bw[i]=mid[i]?((up[i]-lo[i])/mid[i])*100:null;
    pb[i]=up[i]===lo[i]?0.5:(c[i]-lo[i])/(up[i]-lo[i]);}
  return{mid,upper:up,lower:lo,bandwidth:bw,percentB:pb};}

function obv(bars){const o=[0];
  for(let i=1;i<bars.length;i++)o.push(o[i-1]+(bars[i].close>bars[i-1].close?(bars[i].volume||0)
    :bars[i].close<bars[i-1].close?-(bars[i].volume||0):0));return o;}

/* annualised realised volatility from log returns over the last n sessions */
function realizedVol(c,n=252){
  const s=c.slice(-(n+1));if(s.length<20)return null;
  const r=[];for(let i=1;i<s.length;i++)if(s[i-1]>0)r.push(Math.log(s[i]/s[i-1]));
  if(r.length<15)return null;
  const m=r.reduce((a,b)=>a+b,0)/r.length;
  const v=r.reduce((a,b)=>a+(b-m)**2,0)/(r.length-1);
  return Math.sqrt(v)*Math.sqrt(252);}

function maxDrawdown(c){let peak=c[0],mdd=0;
  for(const v of c){if(v>peak)peak=v;const d=(peak-v)/peak;if(d>mdd)mdd=d;}return mdd;}

/* ---------- probability maths ----------
   Normal CDF via Abramowitz & Stegun 7.1.26 (|error| < 7.5e-8). */
function normCdf(x){
  const a1=.254829592,a2=-.284496736,a3=1.421413741,a4=-1.453152027,a5=1.061405429,p=.3275911;
  const s=x<0?-1:1,z=Math.abs(x)/Math.SQRT2,t=1/(1+p*z);
  const y=1-(((((a5*t+a4)*t)+a3)*t+a2)*t+a1)*t*Math.exp(-z*z);
  return .5*(1+s*y);}

/* P(close beyond a level at horizon) and P(touching it at any point).
   Assumes log returns ~ N(0, sigma^2 T): zero drift — no directional
   edge is assumed, only the stock's own measured volatility. */
function levelProb(price,level,sigmaAnnual,days){
  if(!price||!level||!sigmaAnnual||!days)return null;
  const T=days/252,sd=sigmaAnnual*Math.sqrt(T);
  if(sd<=0)return null;
  const z=Math.log(level/price)/sd;
  const above=1-normCdf(z);
  const end=level>price?above:1-above;          // P(end beyond the level)
  const touch=Math.min(1,2*end);                // reflection principle, zero drift
  return{end,touch,sigmas:Math.abs(z),sd_pct:sd*100};}

/* symmetric expected range at a horizon */
function volCone(price,sigmaAnnual,days){
  if(!price||!sigmaAnnual)return null;
  const sd=sigmaAnnual*Math.sqrt(days/252);
  return{one:{lo:price*Math.exp(-sd),hi:price*Math.exp(sd)},
         two:{lo:price*Math.exp(-2*sd),hi:price*Math.exp(2*sd)},sd_pct:sd*100};}

/* least-squares regression on log price, extended forward */
function regression(c,lookback=120){
  const s=c.slice(-lookback);if(s.length<20)return null;
  const n=s.length,y=s.map(v=>Math.log(v));
  let sx=0,sy=0,sxy=0,sxx=0;
  for(let i=0;i<n;i++){sx+=i;sy+=y[i];sxy+=i*y[i];sxx+=i*i;}
  const slope=(n*sxy-sx*sy)/(n*sxx-sx*sx),icpt=(sy-slope*sx)/n;
  const resid=y.map((v,i)=>v-(icpt+slope*i));
  const sd=Math.sqrt(resid.reduce((a,b)=>a+b*b,0)/(n-1));
  return{slope,intercept:icpt,sd,n,
    at:(i)=>Math.exp(icpt+slope*i),
    annualDrift:(Math.exp(slope*252)-1)*100};}

/* ---------- structure ---------- */
function swings(bars,win=5){const hi=[],lo=[];
  for(let i=win;i<bars.length-win;i++){const w=bars.slice(i-win,i+win+1);
    if(bars[i].high===Math.max(...w.map(b=>b.high)))hi.push({i,date:bars[i].date,price:bars[i].high});
    if(bars[i].low===Math.min(...w.map(b=>b.low)))lo.push({i,date:bars[i].date,price:bars[i].low});}
  return{highs:hi,lows:lo};}

function levels(bars,price,win=5){const s=swings(bars,win);
  const r=[...new Set(s.highs.filter(h=>h.price>price).map(h=>h.price))].sort((a,b)=>a-b).slice(0,4);
  const p=[...new Set(s.lows.filter(l=>l.price<price).map(l=>l.price))].sort((a,b)=>b-a).slice(0,4);
  return{resistance:r,support:p};}

/* Break of structure: most recent close beyond a prior swing extreme */
function lastBOS(bars,win=5){const s=swings(bars,win);const n=bars.length;
  let best=null;
  for(let i=win+1;i<n;i++){
    const ph=s.highs.filter(h=>h.i<i-win).map(h=>h.price);
    const pl=s.lows.filter(l=>l.i<i-win).map(l=>l.price);
    if(ph.length&&bars[i].close>Math.max(...ph))best={dir:"bullish",price:Math.max(...ph),date:bars[i].date,i};
    if(pl.length&&bars[i].close<Math.min(...pl))best={dir:"bearish",price:Math.min(...pl),date:bars[i].date,i};}
  return best;}

/* Fair value gaps: 3-bar imbalance where bar1 and bar3 do not overlap */
function fvgs(bars,price,lookback=120){
  const out=[],s=Math.max(2,bars.length-lookback);
  for(let i=s;i<bars.length;i++){
    const a=bars[i-2],c=bars[i];
    if(a.high<c.low)out.push({type:"bullish",lo:a.high,hi:c.low,date:c.date,i});
    if(a.low>c.high)out.push({type:"bearish",lo:c.high,hi:a.low,date:c.date,i});}
  // keep only gaps price has not yet traded back through
  const open=out.filter(g=>{
    for(let j=g.i+1;j<bars.length;j++){
      if(bars[j].low<=g.lo&&bars[j].high>=g.hi)return false;}
    return true;});
  return{above:open.filter(g=>g.lo>price).sort((x,y)=>x.lo-y.lo).slice(0,3),
         below:open.filter(g=>g.hi<price).sort((x,y)=>y.hi-x.hi).slice(0,3)};}

/* Order block: last opposing candle before an impulsive move */
function orderBlocks(bars,price,atrVal,lookback=120){
  const out=[],s=Math.max(1,bars.length-lookback);
  for(let i=s;i<bars.length-1;i++){
    const b=bars[i],nx=bars[i+1];
    const impulse=atrVal?Math.abs(nx.close-nx.open)>1.5*atrVal:false;
    if(!impulse)continue;
    if(b.close<b.open&&nx.close>nx.open)out.push({type:"bullish",lo:b.low,hi:b.high,date:b.date});
    if(b.close>b.open&&nx.close<nx.open)out.push({type:"bearish",lo:b.low,hi:b.high,date:b.date});}
  const bull=out.filter(o=>o.type==="bullish"&&o.hi<price).slice(-2).reverse();
  const bear=out.filter(o=>o.type==="bearish"&&o.lo>price).slice(-2).reverse();
  return{bullish:bull,bearish:bear};}

function fib(hi,lo){const d=hi-lo;
  return{"78.6%":hi-d*.786,"61.8%":hi-d*.618,"50%":hi-d*.5,"38.2%":hi-d*.382,"23.6%":hi-d*.236};}

function pivots(b){const p=(b.high+b.low+b.close)/3;
  return{P:p,R1:2*p-b.low,S1:2*p-b.high,R2:p+(b.high-b.low),S2:p-(b.high-b.low)};}

function aggregate(bars,mode){const m=new Map();
  for(const b of bars){let k;
    if(mode==="month")k=b.date.slice(0,7);
    else{const d=new Date(b.date+"T00:00:00Z");
      d.setUTCDate(d.getUTCDate()-((d.getUTCDay()+6)%7));k=d.toISOString().slice(0,10);}
    if(!m.has(k))m.set(k,{...b,date:k});
    else{const x=m.get(k);x.high=Math.max(x.high,b.high);x.low=Math.min(x.low,b.low);
      x.close=b.close;x.volume=(x.volume||0)+(b.volume||0);}}
  return[...m.values()];}

function trendOf(bars){
  if(!bars||bars.length<25)return{label:"NO DATA",detail:"not enough bars",score:0};
  const c=bars.map(b=>b.close),e=ema(c,20),i=c.length-1;
  const above=e[i]!=null&&c[i]>e[i];
  const rec=bars.slice(-12),old=bars.slice(-24,-12);
  const hh=Math.max(...rec.map(b=>b.high))>Math.max(...old.map(b=>b.high));
  const hl=Math.min(...rec.map(b=>b.low))>Math.min(...old.map(b=>b.low));
  if(above&&hh&&hl)return{label:"BULLISH",detail:"above EMA20, higher highs and higher lows",score:1};
  if(!above&&!hh&&!hl)return{label:"BEARISH",detail:"below EMA20, lower highs and lower lows",score:-1};
  return{label:"MIXED",detail:`${above?"above":"below"} EMA20, HH:${hh?"yes":"no"} HL:${hl?"yes":"no"}`,score:0};}

/* ---------- valuation ---------- */
function twoStageDCF({fcf,shares,g1,g2,disc,term,netCash}){
  if(!(fcf>0)||!(shares>0)||!(disc>term))return null;
  let pv=0,f=fcf;
  for(let y=1;y<=5;y++){f*=1+g1;pv+=f/Math.pow(1+disc,y);}
  for(let y=6;y<=10;y++){f*=1+g2;pv+=f/Math.pow(1+disc,y);}
  pv+=(f*(1+term))/(disc-term)/Math.pow(1+disc,10);
  return(pv+(netCash||0))/shares;}

/* solve for the year 1-5 growth rate the current price already implies */
function reverseDCF({price,fcf,shares,disc,term,netCash,g2ratio=0.5}){
  if(!(fcf>0)||!(shares>0)||!(price>0)||!(disc>term))return null;
  let lo=-0.5,hi=1.0;
  const f=(g)=>twoStageDCF({fcf,shares,g1:g,g2:Math.max(term,g*g2ratio),disc,term,netCash})-price;
  if(f(lo)>0)return lo;if(f(hi)<0)return hi;
  for(let i=0;i<80;i++){const m=(lo+hi)/2;if(f(m)>0)hi=m;else lo=m;}
  return(lo+hi)/2;}

function grahamNumber(eps,bvps){return eps>0&&bvps>0?Math.sqrt(22.5*eps*bvps):null;}
function grahamGrowth(eps,g,aaa=4.4,y=5.0){
  return eps>0&&g!=null?(eps*(8.5+2*Math.min(Math.max(g*100,0),20))*aaa)/y:null;}
function lynchValue(eps,g){const gp=g!=null?Math.min(Math.max(g*100,0),25):null;
  return eps>0&&gp>0?eps*gp:null;}
function epv(ebit,taxRate,wacc,shares,netCash){
  if(!(ebit>0)||!(wacc>0)||!(shares>0))return null;
  return((ebit*(1-(taxRate??0.21))/wacc)+(netCash||0))/shares;}
function ddm(div,g,req){return div>0&&req>g?div*(1+g)/(req-g):null;}

function median(a){const s=a.slice().sort((x,y)=>x-y),n=s.length;
  if(!n)return null;return n%2?s[(n-1)/2]:(s[n/2-1]+s[n/2])/2;}

async function jget(url,vendor){
  const r=await fetch(url,{cache:"no-store"});
  if(vendor)bumpQuota(vendor);
  if(!r.ok)throw new Error("HTTP "+r.status+" "+r.statusText);
  const j=await r.json();
  if(j&&j["Error Message"])throw new Error(j["Error Message"]);
  if(j&&j.Note)throw new Error(j.Note);
  if(j&&j.Information)throw new Error(j.Information);
  if(j&&j.status==="error")throw new Error(j.message||"vendor error");
  if(j&&j.code&&+j.code>=400)throw new Error(j.message||("code "+j.code));
  return j;}

/* ================= cross-verification ================= */
function crossCheck(a,b){
  if(!a||!b)return null;
  const m=new Map(b.map(x=>[x.date,x.close]));
  const pairs=a.slice(-40).filter(x=>m.has(x.date)).slice(-12);
  if(pairs.length<5)return{checked:pairs.length,status:"NO OVERLAP",worst:null};
  let worst=0,wd=null;
  for(const p of pairs){const o=m.get(p.date);if(!o)continue;
    const d=Math.abs(p.close-o)/o*100;if(d>worst){worst=d;wd=p.date;}}
  return{checked:pairs.length,worst,worst_date:wd,
    status:worst<0.5?"AGREE":worst<2?"MINOR DIVERGENCE":"DISAGREE"};}

    atr:a[i],adx:ax.adx[i],pdi:ax.pdi[i],ndi:ax.ndi[i],
    bbU:bb.upper[i],bbL:bb.lower[i],bbMid:bb.mid[i],bbW:bb.bandwidth[i],pctB:bb.percentB[i],
    bbSqueeze:(()=>{const w=bb.bandwidth.slice(-120).filter(x=>x!=null).sort((x,y)=>x-y);
      return w.length>20&&bb.bandwidth[i]<=w[Math.floor(w.length*0.2)];})(),
    obvSlope,vol20,lastVol:bars[i].volume,relVol:vol20?bars[i].volume/vol20:null,
    vol,cone,reg,levels:lv,bos,fvg:fv,ob:obk,hi52,lo52,rangePos,trends,
    mdd:E.maxDrawdown(c.slice(-504)),
    fib:E.fib(hi52,lo52),pivots:E.pivots(bars[i]),
    chart:bars.slice(-200).map((b,k,arr)=>{const gi=bars.length-arr.length+k;
      return{date:b.date,close:b.close,volume:b.volume,ema20:e20[gi],ema50:e50[gi],
        ema200:e200[gi],bbU:bb.upper[gi],bbL:bb.lower[gi]};})};}

/* ---- valuation with the user's assumptions ---- */
function valuate(){
  const f=CUR.fund,T=T_,E=ENG;
  if(!f||f.error||f.is_etf||!T)return null;
  const price=T.price;
  const g1=A.g1/100,g2=A.g2/100,disc=A.disc/100,term=A.term/100;
  const models=[];
  const dcf=E.twoStageDCF({fcf:f.fcf_base,shares:f.shares,g1,g2,disc,term,netCash:f.net_cash});
  models.push({n:"Two-stage DCF",v:dcf,
    why:dcf==null?"needs positive free cash flow and share count":
    `10 years of FCF from a ${big(f.fcf_base)} base, growing ${A.g1}% then ${A.g2}%, discounted at ${A.disc}%, plus ${big(f.net_cash)} net cash`});
  const gn=E.grahamNumber(f.eps_ttm,f.bvps);
  models.push({n:"Graham Number",v:gn,why:gn==null?"needs positive EPS and book value":
    `√(22.5 × EPS ${fmt(f.eps_ttm)} × book ${fmt(f.bvps)}) — Graham's defensive ceiling`});
  const gg=E.grahamGrowth(f.eps_ttm,f.eps_cagr);
  models.push({n:"Graham growth formula",v:gg,why:gg==null?"needs positive EPS":
    `EPS × (8.5 + 2 × ${fmt(Math.min(Math.max((f.eps_cagr||0)*100,0),20),1)}% growth), bond-yield adjusted`});
  const ly=E.lynchValue(f.eps_ttm,f.eps_cagr);
  models.push({n:"Lynch fair value",v:ly,why:ly==null?"needs positive EPS and growth":
    `EPS ${fmt(f.eps_ttm)} × growth rate ${fmt(Math.min(Math.max((f.eps_cagr||0)*100,0),25),0)} (Lynch's PEG=1 rule)`});
  const ep=E.epv(f.ebit,f.tax_rate,disc,f.shares,f.net_cash);
  models.push({n:"Earnings power value",v:ep,why:ep==null?"needs positive operating income":
    `after-tax EBIT ${big(f.ebit*(1-f.tax_rate))} capitalised at ${A.disc}%, no growth assumed`});
  const dd=E.ddm(f.dividend_ps,Math.min(g2,disc-0.005),disc);
  models.push({n:"Dividend discount",v:dd,why:dd==null?"no dividend, or growth exceeds discount rate":
    `dividend ${fmt(f.dividend_ps)} growing ${A.g2}%, discounted at ${A.disc}%`});
  const good=models.filter(x=>x.v!=null&&x.v>0&&isFinite(x.v));
  const vals=good.map(x=>x.v);
  const fair=E.median(vals);
  const lo=vals.length?Math.min(...vals):null,hi=vals.length?Math.max(...vals):null;
  const dispersion=(fair&&lo!=null)?(hi-lo)/fair:null;
  const gap=(fair&&price)?(price-fair)/fair:null;
  const buyAt=fair?fair*(1-A.mos/100):null;
  const impliedG=E.reverseDCF({price,fcf:f.fcf_base,shares:f.shares,disc,term,netCash:f.net_cash});
  return{models,good,fair,lo,hi,dispersion,gap,buyAt,impliedG,price};}

/* ---- evidence ledger: every factor is a measured fact ---- */
function ledger(){
  const T=T_,f=CUR.fund,V=V_,out=[];
  const add=(cat,label,w,dir,detail)=>out.push({cat,label,w,dir,detail});
  if(T){
    add("Trend","Price vs 200-day EMA",3,T.price>T.e200?1:-1,
      `$${fmt(T.price)} vs $${fmt(T.e200)} — ${pctv((T.price/T.e200-1)*100)} ${T.price>T.e200?"above":"below"}`);
    if(T.goldenCross)add("Trend","50/200 moving-average cross",2,T.goldenCross.startsWith("golden")?1:-1,T.goldenCross);
    add("Trend","Monthly structure",3,T.trends.monthly.score,T.trends.monthly.label+" — "+T.trends.monthly.detail);
    add("Trend","Weekly structure",2,T.trends.weekly.score,T.trends.weekly.label+" — "+T.trends.weekly.detail);
    add("Trend","Daily structure",1,T.trends.daily.score,T.trends.daily.label+" — "+T.trends.daily.detail);
    if(T.adx!=null)add("Trend","ADX trend strength",1,T.adx>25?(T.pdi>T.ndi?1:-1):0,
      `ADX ${fmt(T.adx,1)} ${T.adx>25?"(trending)":"(no strong trend — direction carries little weight)"}, +DI ${fmt(T.pdi,1)} vs −DI ${fmt(T.ndi,1)}`);
    add("Momentum","RSI (14)",2,T.rsi>55?1:T.rsi<45?-1:0,
      `${fmt(T.rsi,1)} — ${T.rsi>70?"overbought, stretched":T.rsi>55?"positive momentum":T.rsi<30?"oversold":T.rsi<45?"weak momentum":"neutral"}`);
    add("Momentum","MACD vs signal",2,T.macd>T.macdSig?1:-1,
      `${fmt(T.macd,3)} vs ${fmt(T.macdSig,3)} — histogram ${fmt(T.macdHist,3)}`);
    if(T.roc!=null)add("Momentum","20-day rate of change",1,T.roc>0?1:-1,`${pctv(T.roc)} over 20 sessions`);
    if(T.mfi!=null)add("Momentum","Money flow index",1,T.mfi>55?1:T.mfi<45?-1:0,
      `${fmt(T.mfi,1)} — volume-weighted; ${T.mfi>80?"heavy buying, extended":T.mfi<20?"heavy selling":"mid-range"}`);
    add("Volume","On-balance volume, 20 sessions",2,T.obvSlope>0?1:-1,
      `${T.obvSlope>0?"rising":"falling"} — volume is ${T.obvSlope>0?"accumulating on up days":"heavier on down days"}`);
    if(T.relVol!=null)add("Volume","Latest volume vs 20-day average",1,T.relVol>1.2?1:T.relVol<0.7?-1:0,
      `${fmt(T.relVol,2)}× — ${T.relVol>1.5?"unusually heavy participation":T.relVol<0.7?"thin, low conviction":"normal"}`);
    if(T.rangePos!=null)add("Structure","Position in 52-week range",2,T.rangePos>0.7?1:T.rangePos<0.3?-1:0,
      `${pct(T.rangePos,0)} of the range — ${T.rangePos>0.5?"premium half (strength, but less room)":"discount half (value, but proving weakness)"}`);
    if(T.bos)add("Structure","Last break of structure",2,T.bos.dir==="bullish"?1:-1,
      `${T.bos.dir} break through $${fmt(T.bos.price)} on ${T.bos.date}`);
    if(T.bbSqueeze)add("Structure","Bollinger squeeze",0,0,
      `bandwidth ${pctv(T.bbW)} sits in the lowest fifth of 120 sessions — a move is being coiled, direction unknown`);
  }
  if(f&&!f.error&&!f.is_etf){
    add("Business","Revenue growth (3-year)",2,f.rev_cagr_3y>0.05?1:f.rev_cagr_3y<0?-1:0,
      `${pct(f.rev_cagr_3y)} compound — 5-year ${pct(f.rev_cagr_5y)}`);
    add("Business","Free cash flow trend",3,f.fcf_latest>0?(f.fcf_cagr>0?1:0):-1,
      f.fcf_latest>0?`${big(f.fcf_latest)} latest, compounding ${pct(f.fcf_cagr)}`:`negative free cash flow (${big(f.fcf_latest)}) — burning cash`);
    if(f.roic!=null)add("Business","Return on invested capital",3,f.roic>0.12?1:f.roic<0.06?-1:0,
      `${pct(f.roic)} — ${f.roic>0.15?"excellent, a genuine compounder":f.roic>0.10?"solid":"below the cost of most capital"}`);
    if(f.op_margin!=null)add("Business","Operating margin",1,f.op_margin>0.15?1:f.op_margin<0.05?-1:0,pct(f.op_margin));
    if(f.debt_to_equity!=null)add("Balance sheet","Debt to equity",2,f.debt_to_equity<0.5?1:f.debt_to_equity>2?-1:0,
      `${fmt(f.debt_to_equity)} — ${f.debt_to_equity<0.5?"fortress":f.debt_to_equity>2?"heavily levered":"manageable"}`);
    if(f.interest_coverage!=null)add("Balance sheet","Interest coverage",1,f.interest_coverage>5?1:f.interest_coverage<2?-1:0,
      `${fmt(f.interest_coverage,1)}× operating income covers interest`);
    add("Balance sheet","Net cash position",1,f.net_cash>0?1:-1,
      `${big(f.net_cash)} ${f.net_cash>0?"net cash":"net debt"}`);
  }
  if(V&&V.gap!=null)add("Valuation","Price vs blended fair value",3,V.gap<-0.15?1:V.gap>0.15?-1:0,
    `trading ${pctv(Math.abs(V.gap*100))} ${V.gap<0?"below":"above"} the median of ${V.good.length} models ($${fmt(V.fair)})`);
  if(V&&V.impliedG!=null)add("Valuation","Growth the price already assumes",2,
    V.impliedG<0.05?1:V.impliedG>0.15?-1:0,
    `reverse DCF: today's price requires ${pct(V.impliedG)} FCF growth for 5 years — ${V.impliedG>0.15?"a demanding bar":V.impliedG<0.05?"a low bar the business may clear easily":"a moderate bar"}`);
  const e=CUR.earnings;
  if(e&&!e.error&&e.scored)add("Execution","Earnings versus estimates",2,
    e.beats/e.scored>=0.75?1:e.beats/e.scored<=0.4?-1:0,
    `beat in ${e.beats} of the last ${e.scored} quarters, average surprise ${pctv(e.avg_surprise)}`);
  const an=CUR.analysts;
  if(an&&!an.error&&an.trends.length){const t=an.trends[0];
    const bull=(t.strongBuy||0)+(t.buy||0),bear=(t.sell||0)+(t.strongSell||0),tot=bull+bear+(t.hold||0);
    if(tot)add("Analysts","Sell-side consensus",1,bull/tot>0.6?1:bear/tot>0.25?-1:0,
      `${bull} buy · ${t.hold||0} hold · ${bear} sell (${esc(t.period||"")})`);}
  return out;}

function score(L){
  let bull=0,bear=0;
  for(const x of L){if(x.w===0)continue;
    if(x.dir>0)bull+=x.w;else if(x.dir<0)bear+=x.w;}
  const tot=bull+bear;
  const net=tot?(bull-bear)/tot:0;
  const pts=tot?Math.round((bull/tot)*100):null;
  const edge=Math.abs(net)<0.15?"NO EDGE":net>0.45?"STRONG BULL":net>0.15?"LEAN BULL":
    net<-0.45?"STRONG BEAR":"LEAN BEAR";
  return{bull,bear,tot,net,pts,edge,
    grade:pts==null?"—":pts>=80?"A":pts>=70?"B":pts>=60?"C":pts>=45?"D":"F"};}

/* ---- scenarios: real levels, probabilities from measured volatility ---- */
function scenarios(){
  const T=T_,E=ENG;if(!T||!T.vol)return null;
  const price=T.price;
  const horizons=[{n:"1 week",d:5},{n:"1 month",d:21},{n:"3 months",d:63}];
  const res=T.levels.resistance[0]??T.hi52,sup=T.levels.support[0]??T.lo52;
  return horizons.map(h=>{
    const cone=E.volCone(price,T.vol,h.d);
    const pUp=E.levelProb(price,res,T.vol,h.d),pDn=E.levelProb(price,sup,T.vol,h.d);
    // base band = ±0.5σ around today's price; bull/bear are the tails beyond it
    const half=T.vol*Math.sqrt(h.d/252)*0.5;
    const bandHi=price*Math.exp(half),bandLo=price*Math.exp(-half);
    const pBull=1-E.normCdf(half/(T.vol*Math.sqrt(h.d/252)));
    const pBear=pBull,pBase=1-pBull-pBear;
    return{...h,cone,res,sup,pUp,pDn,bandHi,bandLo,
      bull:{lo:bandHi,target:cone.one.hi,p:pBull},
      base:{lo:bandLo,hi:bandHi,p:pBase},
      bear:{hi:bandLo,target:cone.one.lo,p:pBear}};});}

let CUR=null,T_=null,V_=null,L_=null,S_=null,charts={},pollTimer=null,TAB="verdict";
const A={g1:8,g2:4,disc:10,term:2.5,mos:25};

function recents(){try{return JSON.parse(localStorage.getItem("recents")||"[]");}catch{return[];}}
function pushRecent(s){const r=recents().filter(x=>x!==s);r.unshift(s);
  localStorage.setItem("recents",JSON.stringify(r.slice(0,12)));drawRecents();}
function drawRecents(){const r=recents();
  $("#recents").innerHTML=r.length?r.map(s=>`<button onclick="run('${esc(s)}')">${esc(s)}</button>`).join("")
    :`<span class="sub">Analyzed symbols appear here for one tap.</span>`;}

/* ================= run ================= */
async function run(symRaw){
  const sym=(symRaw||$("#sym").value||"").trim().toUpperCase();
  if(!sym){$("#app").innerHTML=`<div class="panel"><h2>Nothing to analyze</h2>
    <p class="note">Type any ticker and press Analyze. Exchange suffixes work — XIC.TO, BNS.TO, SHOP.TO.</p></div>`;return;}
  $("#sym").value=sym;TAB="verdict";
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;$("#btnLive").textContent="Go live (10s)";$("#btnLive").classList.remove("on");}
  $("#app").innerHTML=`<div class="panel"><h2>Analyzing ${esc(sym)} <span class="tag pulse">FIVE VENDORS</span></h2>
    <p class="note">Candles from Twelve Data, cross-checked against Polygon. Quote, profile and analyst trends from Finnhub. Statements from FMP. Earnings history and macro from Alpha Vantage, served from local cache where it is still fresh so the 25-call daily limit is not burned. Anything that fails will name itself rather than go quiet.</p></div>`;
  const R=await Promise.allSettled([getCandles(sym),getQuote(sym),getProfile(sym),getFundamentals(sym),
    getPolyCandles(sym),getMarketStatus(),getAnalysts(sym),getEarnings(sym),getMacro()]);
  const g=(i,src)=>R[i].status==="fulfilled"?R[i].value:{error:String(R[i].reason?.message||R[i].reason),source:src};
  CUR={sym,fetched_at:nowISO(),candles:g(0,"twelvedata"),quote:g(1,"finnhub"),profile:g(2,"finnhub"),
    fund:g(3,"fmp"),poly:g(4,"polygon"),status:g(5,"polygon"),analysts:g(6,"finnhub"),
    earnings:g(7,"alphavantage"),macro:g(8,"alphavantage")};
  CUR.xcheck=(!CUR.candles.error&&!CUR.poly.error)?crossCheck(CUR.candles.bars,CUR.poly.bars):null;
  T_=analyze();V_=valuate();L_=ledger();S_=scenarios();
  pushRecent(sym);render();}

function recompute(){V_=valuate();L_=ledger();render();}
function setTab(t){TAB=t;render();}

/* ================= render ================= */
function render(){
  if(!CUR)return;
  const T=T_,conf=confidence();
  $("#app").innerHTML=`
    ${dataHeader(conf)}
    ${priceStrip()}
    <div class="tabs">
      ${[["verdict","VERDICT"],["tech","TECHNICALS"],["fund","FUNDAMENTALS"],["src","SOURCES"]]
        .map(([k,l])=>`<button class="${TAB===k?"on":""}" onclick="setTab('${k}')">${l}</button>`).join("")}
    </div>
    <div id="tabbody">${TAB==="verdict"?tabVerdict():TAB==="tech"?tabTech():TAB==="fund"?tabFund():tabSrc()}</div>`;
  if(TAB==="tech"&&T)drawPriceChart();
  if(TAB==="verdict"&&T)drawScenarioChart();
  if(TAB==="fund"&&CUR.fund&&!CUR.fund.error&&!CUR.fund.is_etf)drawFundChart();}

function confidence(){
  const x=CUR.xcheck;
  if(CUR.candles.error)return{level:"NONE",cls:"down",why:"no candle data at all"};
  if(!x)return{level:"MEDIUM",cls:"amber",why:"single source — Polygon unavailable for an independent check"};
  if(x.status==="AGREE")return{level:"HIGH",cls:"up",why:`two vendors agree within ${fmt(x.worst,3)}%`};
  if(x.status==="MINOR DIVERGENCE")return{level:"MEDIUM",cls:"amber",why:`vendors differ by up to ${fmt(x.worst,2)}%`};
  if(x.status==="DISAGREE")return{level:"LOW",cls:"down",why:`vendors differ by ${fmt(x.worst,2)}% — likely a split or dividend adjustment mismatch`};
  return{level:"MEDIUM",cls:"amber",why:"insufficient overlap between vendors"};}

function dataHeader(conf){
  const q=CUR.quote,T=T_,x=CUR.xcheck,errs=[];

/* ---------------- VERDICT ---------------- */
function tabVerdict(){
  const T=T_,L=L_,V=V_;
  if(!T)return`<div class="panel"><p class="note">No price history — nothing to judge.</p></div>`;
  const S=score(L);
  const cats=[...new Set(L.map(x=>x.cat))];
  const bulls=L.filter(x=>x.dir>0).sort((a,b)=>b.w-a.w);
  const bears=L.filter(x=>x.dir<0).sort((a,b)=>b.w-a.w);
  const neut=L.filter(x=>x.dir===0);
  const edgeCls=S.edge.includes("BULL")?"up":S.edge.includes("BEAR")?"down":"amber";
  const inval=T.levels.support[0]??T.bos?.price??T.e200;

  return`<div class="grid">
    <div class="panel">
      <h2>The read ${tg("SYNTHESIS OF EVERY MEASURED FACTOR")}</h2>

          <div class="big ${edgeCls}">${S.pts==null?"—":S.pts}<span style="font-size:14px;color:var(--faint)">/100</span></div>
          <div class="bar"><i style="width:${S.pts||0}%;background:var(--${S.pts>=60?"up":S.pts>=45?"live":"down"})"></i></div></div>
        <div><div class="l sub">Direction</div><div class="big ${edgeCls}" style="font-size:19px">${S.edge}</div></div>
        <div><div class="l sub">Bull vs bear weight</div>
          <div style="font-family:var(--mono);font-size:15px"><span class="up">${S.bull}</span> vs <span class="down">${S.bear}</span></div></div>
      </div>
      <div class="verdictline ${edgeCls}">${plainRead(S,T,V)}</div>
      <p class="note">The score is the share of total factor weight pointing bullish. It is a summary of what is measurably true right now — not a forecast, and not advice. Every factor behind it is listed below, so you can disagree with any one of them.</p>
    </div>

    <div class="grid g2">
      <div class="panel"><h2>What argues up <span class="pill b">${bulls.reduce((a,b)=>a+b.w,0)} weight</span></h2>
        ${bulls.length?bulls.map(evRow).join(""):`<p class="note">Nothing measured is currently pointing up.</p>`}</div>
      <div class="panel"><h2>What argues down <span class="pill r">${bears.reduce((a,b)=>a+b.w,0)} weight</span></h2>
        ${bears.length?bears.map(evRow).join(""):`<p class="note">Nothing measured is currently pointing down.</p>`}</div>
    </div>
    ${neut.length?`<div class="panel"><h2>Neutral or context-only</h2>${neut.map(evRow).join("")}</div>`:""}

    <div class="panel">
      <h2>Scenarios ${tg("LEVELS FROM THE CHART · PROBABILITIES FROM MEASURED VOLATILITY")}</h2>
      ${S_?`<div style="height:250px;margin-bottom:10px"><canvas id="cvScen"></canvas></div>`:""}
      ${S_?`<table>
        <tr><th>Horizon</th><th>Bear case</th><th>Base case</th><th>Bull case</th><th>Reach resistance $${fmt(S_[0].res)}</th><th>Reach support $${fmt(S_[0].sup)}</th></tr>
        ${S_.map(s=>`<tr>
          <td>${s.n}</td>
          <td class="down">below $${fmt(s.bear.hi)} · ${pct(s.bear.p,0)}</td>
          <td class="blue">$${fmt(s.base.lo)}–$${fmt(s.base.hi)} · ${pct(s.base.p,0)}</td>
          <td class="up">above $${fmt(s.bull.lo)} · ${pct(s.bull.p,0)}</td>
          <td>${s.pUp?pct(s.pUp.touch,0)+" touch":"—"}</td>
          <td>${s.pDn?pct(s.pDn.touch,0)+" touch":"—"}</td></tr>`).join("")}
      </table>
      <p class="note"><b>How to read this.</b> The base case is where price sits if nothing unusual happens — it is the most likely single outcome purely because it is the widest band, not because the stock is "going sideways". The bull and bear columns are the tails beyond it. The last two columns answer a different and more useful question: what are the odds price <i>touches</i> the nearest real resistance or support at any point in the window, computed from this stock's own ${pctv((T.vol||0)*100)} annualised volatility.<br><br>
      <b>The assumption that could break this.</b> These probabilities assume the next period behaves like the last year, and assume no directional drift. Earnings, a guidance change, or a macro shock all violate that — which is exactly why the evidence ledger above, not this table, carries the actual argument for direction.</p>`
      :`<p class="note err">Volatility could not be measured, so no scenario table.</p>`}
    </div>

    <div class="panel">
      <h2>Invalidation ${tg("WHAT WOULD PROVE THIS READ WRONG")}</h2>
      <div class="stats">
        ${st("Structural invalidation",`$${fmt(inval)}`,"down",`a daily close below this breaks ${T.levels.support[0]?"the nearest support shelf":"the trend reference"}`)}
        ${st("200-day EMA",`$${fmt(T.e200)}`,T.price>T.e200?"up":"down",`${pctv((T.price/T.e200-1)*100)} away — the long-term trend line`)}
        ${st("Nearest resistance",T.levels.resistance[0]?`$${fmt(T.levels.resistance[0])}`:"none in range","up",T.levels.resistance[0]?`${pctv((T.levels.resistance[0]/T.price-1)*100)} above — a close through it strengthens the bull case`:"price is at or near its highs")}
        ${V&&V.buyAt?st(`Your margin-of-safety price`,`$${fmt(V.buyAt)}`,"amber",`${A.mos}% below the blended fair value`):""}
      </div>
      <p class="note">Every thesis needs a level at which you admit it was wrong. These are the ones the data marks out — not opinions, just where the structure changes.</p>
    </div>

    ${honestyPanel()}
  </div>`;}

function evRow(x){
  const p=x.dir>0?`<span class="pill b">bull</span>`:x.dir<0?`<span class="pill r">bear</span>`:`<span class="pill n">context</span>`;
  return`<div class="ev"><div><b style="font-weight:600">${esc(x.label)}</b>
    <div class="sub" style="margin-top:2px">${esc(x.detail)}</div></div>
    <div style="text-align:right;white-space:nowrap">${p}<div class="w">${x.w?"weight "+x.w:"no weight"}</div></div></div>`;}

function plainRead(S,T,V){
  const bits=[];
  if(S.edge==="NO EDGE")bits.push("Signals are genuinely mixed — no edge currently.");
  else bits.push(`Evidence leans ${S.edge.toLowerCase().replace("_"," ")}.`);
  const t=T.trends;
  bits.push(`Monthly ${t.monthly.label.toLowerCase()}, weekly ${t.weekly.label.toLowerCase()}, daily ${t.daily.label.toLowerCase()}.`);
  if(V&&V.gap!=null)bits.push(`Price is ${pctv(Math.abs(V.gap*100))} ${V.gap<0?"below":"above"} the median of ${V.good.length} valuation models.`);
  return bits.join(" ");}

function honestyPanel(){
  return`<div class="panel"><h2>Deliberately absent ${tg("NOT AVAILABLE — SO NOT SHOWN","bad")}</h2>

        </table>

        </div>
        <div>

      <p class="note">Order blocks, fair value gaps and breaks of structure are printed only where the candles meet an explicit rule — an unfilled 3-bar imbalance, or a close beyond a prior swing extreme. Where no pattern meets the rule, the row says none rather than stretching to find one.</p>

  return`<div class="panel"><h2>Macro backdrop ${tg("ALPHA VANTAGE"+(m.cached?" · CACHED "+ago(m.fetched_at):""))}</h2>
    <div class="stats">
      ${m.cpi?st("CPI year over year",pctv(m.cpi.yoy),m.cpi.yoy>3?"down":"up",esc(m.cpi.date)):""}
      ${m.fed?st("Fed funds rate",pctv(m.fed.value),"",esc(m.fed.date)):""}
      ${m.t10?st("10-year Treasury",pctv(m.t10.value),"",esc(m.t10.date)):""}
    </div>
    <p class="note">Rates are the discount rate the whole market applies to future cash flows — when they rise, every valuation model above produces a lower number, growth stocks most of all.</p></div>`;}

        <td class="${o.error?"down":"up"}">${o.error?"FAIL":o.cached?"OK (cached)":"OK"}</td>

    </div>
    <div class="panel"><h2>Candle cross-verification</h2>
      ${x?`<div class="verdictline ${x.status==="AGREE"?"up":x.status==="DISAGREE"?"down":"amber"}">

        <p class="note">Twelve Data and Polygon are independent vendors. When their closes agree, the indicators built on them can be trusted. When they diverge by more than about 2%, one of them has usually not adjusted for a split or a dividend — treat every level on the Technicals tab as suspect until it clears.</p>`
      :`<p class="note">No cross-check ran — Polygon covers US listings only, and does not carry this symbol. Indicators still compute from Twelve Data alone, but nothing independently confirms them.</p>`}
    </div>
    <div class="panel"><h2>Free-tier budgets</h2>

        <tr><td>Twelve Data</td><td>800 per day</td><td>1 call</td></tr>
        <tr><td>FMP</td><td>250 per day</td><td>6 calls, then cached 24 hours</td></tr>
        <tr><td>Polygon</td><td>5 per minute</td><td>2 calls</td></tr>
        <tr><td>Alpha Vantage</td><td>25 per day</td><td>3 calls, cached a week (earnings) and a day (macro)</td></tr></table>
      <p class="note">FMP is the binding constraint at roughly 40 fresh companies a day. Re-analyzing a symbol you have already looked at today costs no FMP calls at all.</p>

/* ---------------- charts ---------------- */
const CH={grid:"#282C34",tick:"#5E626C",font:"IBM Plex Mono"};
function axis(extra){return{ticks:{color:CH.tick,font:{family:CH.font,size:9},maxTicksLimit:10},
  grid:{color:CH.grid},...extra};}
function baseOpts(){return{responsive:true,maintainAspectRatio:false,
  interaction:{mode:"index",intersect:false},
  plugins:{legend:{labels:{color:"#8C909A",font:{family:CH.font,size:10},boxWidth:10}}},
  scales:{x:axis(),y:axis()}};}

function drawPriceChart(){
  const el=$("#cvPrice");if(!el||typeof Chart==="undefined")return;
  if(charts.price)charts.price.destroy();
  const d=T_.chart;
  charts.price=new Chart(el,{type:"line",data:{labels:d.map(x=>x.date.slice(5)),datasets:[
    {label:"BB upper",data:d.map(x=>x.bbU),borderColor:"rgba(140,144,154,.35)",borderWidth:1,pointRadius:0,fill:false},
    {label:"BB lower",data:d.map(x=>x.bbL),borderColor:"rgba(140,144,154,.35)",borderWidth:1,pointRadius:0,fill:"-1",backgroundColor:"rgba(140,144,154,.05)"},
    {label:"Close",data:d.map(x=>x.close),borderColor:"#E8E5DD",borderWidth:1.8,pointRadius:0},
    {label:"EMA 20",data:d.map(x=>x.ema20),borderColor:"#4CAF7D",borderWidth:1,pointRadius:0},
    {label:"EMA 50",data:d.map(x=>x.ema50),borderColor:"#7A9BC4",borderWidth:1,pointRadius:0},
    {label:"EMA 200",data:d.map(x=>x.ema200),borderColor:"#E8A33D",borderWidth:1.3,pointRadius:0}]},
    options:baseOpts()});}

function drawScenarioChart(){
  const el=$("#cvScen");if(!el||typeof Chart==="undefined"||!S_||!T_||!T_.vol)return;
  if(charts.scen)charts.scen.destroy();
  const T=T_,hist=T.chart.slice(-60);
  const labels=hist.map(x=>x.date.slice(5));
  const fwd=["+1w","+2w","+1m","+2m","+3m"],fwdDays=[5,10,21,42,63];
  labels.push(...fwd);
  const n=hist.length;
  const pad=Array(n).fill(null);
  const E=ENG;
  const mk=(mult)=>{const a=pad.slice();a[n-1]=T.price;
    for(const d of fwdDays){const sd=T.vol*Math.sqrt(d/252);a.push(T.price*Math.exp(mult*sd));}return a;};
  const flat=pad.slice();flat[n-1]=T.price;fwdDays.forEach(()=>flat.push(T.price));
  charts.scen=new Chart(el,{type:"line",data:{labels,datasets:[
    {label:"Close",data:[...hist.map(x=>x.close),...fwd.map(()=>null)],borderColor:"#E8E5DD",borderWidth:1.8,pointRadius:0},
    {label:"+2σ",data:mk(2),borderColor:"rgba(76,175,125,.4)",borderDash:[4,4],borderWidth:1,pointRadius:0},
    {label:"+1σ",data:mk(1),borderColor:"rgba(76,175,125,.8)",borderWidth:1.2,pointRadius:0},
    {label:"today's price held",data:flat,borderColor:"rgba(122,155,196,.7)",borderDash:[2,3],borderWidth:1,pointRadius:0},
    {label:"−1σ",data:mk(-1),borderColor:"rgba(224,82,82,.8)",borderWidth:1.2,pointRadius:0},
    {label:"−2σ",data:mk(-2),borderColor:"rgba(224,82,82,.4)",borderDash:[4,4],borderWidth:1,pointRadius:0}]},
    options:baseOpts()});}

function drawFundChart(){
  const el=$("#cvFund");if(!el||typeof Chart==="undefined")return;
  if(charts.fund)charts.fund.destroy();
  const a=CUR.fund.annual;
  charts.fund=new Chart(el,{data:{labels:a.map(x=>x.year),datasets:[
    {type:"bar",label:"Revenue",data:a.map(x=>x.revenue),backgroundColor:"rgba(122,155,196,.4)"},
    {type:"line",label:"Net income",data:a.map(x=>x.net_income),borderColor:"#4CAF7D",borderWidth:1.8,pointRadius:2},
    {type:"line",label:"Free cash flow",data:a.map(x=>x.fcf),borderColor:"#E8A33D",borderWidth:1.8,pointRadius:2}]},
    options:{...baseOpts(),scales:{x:axis(),y:axis({ticks:{color:CH.tick,font:{family:CH.font,size:9},
      callback:v=>big(v)}})}}});}

/* ---------------- live polling ---------------- */
async function toggleLive(){
  if(pollTimer){clearInterval(pollTimer);pollTimer=null;
    $("#btnLive").textContent="Go live (10s)";$("#btnLive").classList.remove("on");
    const n=$("#liveNote");if(n)n.innerHTML="";return;}
  if(!CUR){alert("Analyze a ticker first.");return;}
  if(!KEYS.finn){alert("A Finnhub key is needed for live quotes.");return;}
  let ok=true;
  const tick=async()=>{
    try{
      const q=await getQuote(CUR.sym);
      CUR.quote=q;T_=analyze();V_=valuate();
      const p=$("#pxNow");if(p)p.textContent="$"+fmt(q.current);
      const c=$("#pxChg");if(c){c.textContent=`${q.change>=0?"+":""}${fmt(q.change)} (${q.change>=0?"+":""}${fmt(q.change_pct)}%)`;
        c.className=sgn(q.change);}
      const n=$("#liveNote");if(n)n.innerHTML=`<span class="up pulse">● LIVE ${new Date().toLocaleTimeString()}</span>`;
    }catch(e){ok=false;clearInterval(pollTimer);pollTimer=null;
      $("#btnLive").textContent="Go live (10s)";$("#btnLive").classList.remove("on");
      const n=$("#liveNote");if(n)n.innerHTML=`<span class="err">live polling stopped — ${esc(e.message||e)}</span>`;}};
  await tick();if(!ok)return;
  pollTimer=setInterval(tick,10000);
  $("#btnLive").textContent="Stop live";$("#btnLive").classList.add("on");}
