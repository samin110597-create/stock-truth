name: ChatGPT bootstrap prepared files

"on":
  push:
    branches: [chatgpt/institutional-ml-v3]
    paths:
      - '.github/workflows/chatgpt-bootstrap.yml'
  pull_request:
    branches: [main]
    paths:
      - '.chatgpt/**'
      - '.github/workflows/chatgpt-bootstrap.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/institutional-ml-v3
          fetch-depth: 0

      - name: Install prepared dashboard and ML files
        shell: bash
        run: |
          set -euo pipefail
          cat .chatgpt/payload.* > /tmp/payload.b64
          base64 -d /tmp/payload.b64 > /tmp/payload.tar.gz
          tar -xzf /tmp/payload.tar.gz -C "$GITHUB_WORKSPACE"
          python -m py_compile scripts/ml_predict.py
          rm -rf .chatgpt

          git config user.name "chatgpt-repo-update"
          git config user.email "chatgpt-repo-update@users.noreply.github.com"
          git add -A docs/index.html scripts/ml_predict.py requirements-ml.txt MODEL.md .chatgpt
          git commit -m "feat: secure institutional dashboard with walk-forward ML"
          git push origin HEAD:chatgpt/institutional-ml-v3
