name: ML prediction

"on":
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'scripts/ml_predict.py'
      - 'scripts/ml_predict_runner.py'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-prediction.yml'
  pull_request:
    branches: [main]
    paths:
      - 'docs/index.html'
      - 'scripts/ml_predict.py'
      - 'scripts/ml_predict_runner.py'
      - 'requirements-ml.txt'
      - '.github/workflows/ml-prediction.yml'
  schedule:
    # After the prior U.S. regular session, Tue-Sat.
    - cron: '30 0 * * 2-6'

permissions:
  contents: write

concurrency:
  group: stock-truth-ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-model:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements-ml.txt

      - name: Install ML dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-ml.txt

      - name: Validate Python
        run: |
          python -m py_compile scripts/ml_predict.py
          python -m py_compile scripts/ml_predict_runner.py

      - name: Build leakage-aware ML snapshots
        run: python scripts/ml_predict_runner.py --data-dir docs/data --output-dir docs/data/ml

      - name: Validate generated JSON
        run: |
          python - <<'PY'
          import json, pathlib
          files = sorted(pathlib.Path('docs/data/ml').glob('*.json'))
          assert files, 'no ML JSON files were generated'
          for p in files:
              json.loads(p.read_text())
          print(f'validated {len(files)} ML JSON files')
          PY

      - name: Security scan dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('docs/index.html').read_text(encoding='utf-8')
          banned = [
              r'type=["\']password["\']',
              r'api\.twelvedata\.com',
              r'finnhub\.io/api',
              r'api\.polygon\.io',
              r'alphavantage\.co/query',
              r'financialmodelingprep\.com',
              r'localStorage[^\n]{0,120}(key|token)',
              r'prompt\([^\n]{0,120}(key|token)',
          ]
          hits = [p for p in banned if re.search(p, s, re.I)]
          assert not hits, f'public dashboard contains browser-side secret/API paths: {hits}'
          print('dashboard security scan passed')
          PY

      - name: Commit prediction snapshots to main
        if: github.event_name != 'pull_request'
        run: |
          git config user.name 'stock-truth-ml-bot'
          git config user.email 'stock-truth-ml-bot@users.noreply.github.com'
          git add docs/data/ml
          if git diff --cached --quiet; then
            echo 'No ML changes to commit.'
          else
            git commit -m 'data: update walk-forward ML snapshots'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
