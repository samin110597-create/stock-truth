name: Validate dashboard and ML

"on":
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ML dependencies
        run: pip install -r requirements-ml.txt
      - name: Compile ML engine
        run: python -m py_compile scripts/ml_predict.py
      - name: Security scan public dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          s = Path('docs/index.html').read_text(encoding='utf-8')
          banned = [
              r'type=["\']password["\']',
              r'api\.twelvedata\.com',
              r'finnhub\.io/api',
              r'api\.polygon\.io',
              r'alphavantage\.co/query',
              r'financialmodelingprep\.com',
              r'localStorage[^\n]{0,120}(key|token)',
              r'prompt\([^\n]{0,120}(key|token)',
          ]
          hits = [p for p in banned if re.search(p, s, re.I)]
          assert not hits, f'public dashboard contains browser-side secret/API paths: {hits}'
          print('dashboard security scan passed')
          PY
      - name: Confirm ML integration points
        run: |
          python - <<'PY'
          from pathlib import Path
          html = Path('docs/index.html').read_text(encoding='utf-8')
          ml = Path('scripts/ml_predict.py').read_text(encoding='utf-8')
          assert 'data/ml' in html, 'dashboard does not load ML output'
          assert 'NO VERIFIED EDGE' in html, 'dashboard is missing the no-edge safety state'
          assert 'TimeSeriesSplit' in ml, 'ML engine is missing chronological validation'
          print('ML integration checks passed')
          PY
