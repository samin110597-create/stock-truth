<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loading Stock Truth v2…</title>
<style>
body{margin:0;background:#101216;color:#E8E5DD;font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{max-width:620px;padding:28px}.muted{color:#8C909A;font-size:14px;line-height:1.6}.err{color:#E05252;white-space:pre-wrap}
</style>
</head>
<body>
<div class="box"><h2>Loading Stock Truth v2…</h2><div class="muted">Institutional technical terminal · 4H / 1D / 1W / 1Y models · AVWAP chart workspace · 10-quarter fundamentals · model lab</div></div>
<script>
(async()=>{
  const stamp=Date.now();
  const root='https://raw.githubusercontent.com/samin110597-create/stock-truth-v2/main/';
  const [hr,jr,ir,vr]=await Promise.all([
    fetch(root+'docs/index.html?v='+stamp,{cache:'no-store'}),
    fetch(root+'v2-enhance.js?v='+stamp,{cache:'no-store'}),
    fetch(root+'v2-institutional.js?v='+stamp,{cache:'no-store'}),
    fetch(root+'v3-upgrade.js?v='+stamp,{cache:'no-store'})
  ]);
  if(!hr.ok)throw new Error('v2 terminal file HTTP '+hr.status);
  if(!jr.ok)throw new Error('v2 enhancement file HTTP '+jr.status);
  if(!ir.ok)throw new Error('v2 institutional file HTTP '+ir.status);
  if(!vr.ok)throw new Error('v3 upgrade file HTTP '+vr.status);

  let html=await hr.text();
  let enhance=await jr.text();
  let institutional=await ir.text();
  let upgrade=await vr.text();
  const v5='https://stock-truth-v2.vercel.app/api/stock-v5';
  const intraday='https://stock-truth-v2.vercel.app/api/stock-intraday';
  const pipelineData='https://samin110597-create.github.io/stock-truth/data/';

  html=html.replaceAll('./data/',pipelineData);

  html=html.replace('<details id="keybox">','<details id="keybox" style="display:none">');
  html=html.replaceAll('PIPELINE MODE — NO KEYS NEEDED FOR WATCHLIST TICKERS','SECURE SERVER MODE — ANY TICKER');
  html=html.replaceAll('DIRECT MODE — ROBOT DATA NOT FOUND','SECURE SERVER MODE — ANY TICKER');
  html=html.replace('$("#keybox").open=true;','$("#keybox").open=false;');
  html=html.replace(
    '$("#modeNote").textContent="Watchlist tickers load from data the GitHub robot committed. Typing any other ticker fetches it directly, which uses the keys in the panel above.";',
    '$("#modeNote").textContent="Type any ticker. V2 fetches it through the secure server backend; no browser API keys are required. Watchlist symbols are shortcuts only.";'
  );
  html=html.replace(
    '$("#modeNote").innerHTML="The robot\'s data file (<span class=\\"mono\\">data/index.json</span>) is not on this site yet, so the page is calling vendors straight from your browser instead. Paste at least a Twelve Data key above, type a ticker, press Analyze — everything works right now. When the GitHub Action runs successfully this banner disappears on its own and watchlist tickers stop needing keys.";',
    '$("#modeNote").textContent="Secure any-ticker backend active. Cached watchlist data is optional; analysis does not require browser keys.";'
  );

  html=html.replaceAll('TAB="verdict"','TAB="tech"');
  html=html.replace('[['+'"verdict","VERDICT"'+'],['+'"tech","TECHNICALS"'+'],['+'"fund","FUNDAMENTALS"'+'],['+'"rank","RANK"'+'],['+'"src","SOURCES"'+']]','[["tech","TECHNICALS · INSTITUTIONAL"],["verdict","VERDICT"],["fund","FUNDAMENTALS"],["rank","RANK"],["src","SOURCES"]]');

  html=html.replace('["Quote","finnhub",D.quote||{},','["Quote",(D.quote||{}).source,D.quote||{},');
  html=html.replace('["Profile","finnhub",D.profile||{},','["Profile",(D.profile||{}).source,D.profile||{},');
  html=html.replace('["Analyst trends","finnhub",D.analysts||{},','["Analyst trends",(D.analysts||{}).source,D.analysts||{},');
  html=html.replace('["Positioning","yfinance",D.extras||{},','["Positioning",(D.extras||{}).source,D.extras||{},');
  html=html.replace('["Earnings history","alphavantage",D.earnings||{},','["Earnings history",(D.earnings||{}).source,D.earnings||{},');
  html=html.replace('<td class="${o.error?"down":"up"}">${o.error?"FAIL":"OK"}</td>','<td class="${o.error?"down":o.partial?"amber":"up"}">${o.error?"FAIL":o.partial?"PARTIAL":"OK"}</td>');
  html=html.replace('<td class="dim">${o.error?`<span class="err">${esc(o.error)}</span>`:d}</td>','<td class="dim">${o.error?`<span class="err">${esc(o.error)}</span>`:(o.partial&&o.note?esc(o.note):d)}</td>');

  html=html.replace(
    'if(MODE==="pipeline"&&INDEX.tickers.includes(sym))return load(sym);\n  return runDirect(sym);}',
    'return runSecure(sym);}'
  );

  html=html.replace(
`async function setTF(tf){
  if(!TFM[tf]||tf===TF)return;
  TF=tf;localStorage.setItem("tf",tf);
  document.querySelectorAll("#tfbar button.tf").forEach(b=>
    b.classList[b.getAttribute("data-tf")===tf?"add":"remove"]("on"));
  if(!D||!D.symbol)return;
  if(TFM[tf].intraday&&!KEYS.twelve){
    $("#modeNote").innerHTML=\`<span class="err">Intraday candles need a Twelve Data key — open the key panel above.</span>\`;
    return;}
  await runDirect(D.symbol);}`,
`async function setTF(tf){
  if(!TFM[tf]||tf===TF)return;
  TF=tf;localStorage.setItem("tf",tf);
  document.querySelectorAll("#tfbar button.tf").forEach(b=>
    b.classList[b.getAttribute("data-tf")===tf?"add":"remove"]("on"));
  if(!D||!D.symbol)return;
  await runSecure(D.symbol);}`
  );

  html=html.replace('if(!D.direct){await load(D.symbol);return;}','if(!D.direct){await runSecure(D.symbol);return;}');

  const secureFn=`
async function runSecure(sym){
  const M=tfm();
  const secureBase='${v5}',secureIntra='${intraday}';
  $("#app").innerHTML=\`<div class="panel"><h2>Fetching \${esc(sym)} · \${esc(M.label)} <span class="tag pulse">SECURE SERVER</span></h2><p class="note">Any-ticker request. API credentials are not exposed to this browser.</p></div>\`;
  try{
    const br=await fetch(secureBase+'?symbol='+encodeURIComponent(sym),{cache:'no-store'});
    const base=await br.json().catch(()=>({error:'Invalid server response'}));
    if(!br.ok||base.error)throw new Error(base.error||('secure backend HTTP '+br.status));
    D=base;D.direct=false;D.timeframe=TF;
    if(!D.daily&&D.candles)D.daily={source:D.candles.source,fetched_at:D.candles.fetched_at,bars:D.candles.bars};
    if(M.intraday){
      const ir=await fetch(secureIntra+'?symbol='+encodeURIComponent(sym)+'&tf='+encodeURIComponent(TF),{cache:'no-store'});
      const ij=await ir.json().catch(()=>({error:'Invalid intraday server response'}));
      if(!ir.ok||ij.error)throw new Error(ij.error||('intraday backend HTTP '+ir.status));
      D.candles=ij.candles;
      if(ij.quote&&ij.quote.current!=null)D.quote={...(D.quote||{}),current:ij.quote.current,currency:ij.quote.currency||D.quote?.currency};
      D.generated_at=ij.generated_at||D.generated_at;
    }
    MODE='secure';TAB='tech';pushRecent(sym);compute();drawTickerBar();render();startAutoRefresh();
    const mn=$("#modeNote");if(mn)mn.textContent='Secure server mode · any ticker · '+M.label+' · V3 institutional models active · no browser API keys.';
  }catch(e){
    D={symbol:sym,load_error:String(e&&e.message||e)};
    $("#app").innerHTML=\`<div class="panel" style="border-color:rgba(224,82,82,.55)"><h2>Could not load \${esc(sym)} <span class="tag bad">SERVER ERROR</span></h2><p class="note err">\${esc(e&&e.message||e)}</p><p class="note">The request stayed server-side; do not paste API keys into the page.</p></div>\`;
  }
}
`;
  html=html.replace('async function load(sym){',secureFn+'\nasync function load(sym){');

  html=html.replaceAll('https://stock-truth-v2.vercel.app/api/stock-v4?symbol=',v5+'?symbol=');
  html=html.replaceAll('https://stock-truth-v2.vercel.app/api/stock?symbol=',v5+'?symbol=');
  html=html.replaceAll('/api/stock-v4?symbol=',v5+'?symbol=');
  html=html.replaceAll('/api/stock?symbol=',v5+'?symbol=');
  enhance=enhance.replaceAll('https://stock-truth-v2.vercel.app/api/stock-v4',v5);
  enhance=enhance.replaceAll('https://stock-truth-v2.vercel.app/api/stock',v5);
  enhance=enhance.replace(/<\/script/gi,'<\\/script');
  institutional=institutional.replace(/<\/script/gi,'<\\/script');
  upgrade=upgrade.replace(/<\/script/gi,'<\\/script');
  const inline='<'+'script>'+enhance+'<'+'/script>';
  const instInline='<'+'script>'+institutional+'<'+'/script>';
  const v3Inline='<'+'script>'+upgrade+'<'+'/script>';

  const bridge='<'+'script>'+`(()=>{
    let lastKey='';
    function publishV2(){
      try{
        if(typeof D==='undefined'||!D||D.load_error)return;
        const key=[D.symbol||'',D.generated_at||'',D.timeframe||'',D.candles&&D.candles.fetched_at||'',D.candles&&D.candles.latest||''].join('|');
        if(!key||key===lastKey)return;
        lastKey=key;window.V2DATA=D;
        window.dispatchEvent(new CustomEvent('stocktruth:v2data',{detail:D}));
      }catch(e){console.warn('V2 data bridge:',e);}
    }
    setTimeout(publishV2,0);setInterval(publishV2,750);
  })();`+'<'+'/script>';

  const oldTag=/<script\s+src=["']\/v2-enhance\.js["']\s*><\/script>/i;
  if(oldTag.test(html))html=html.replace(oldTag,inline+instInline+v3Inline+bridge);
  else if(/<\/body>/i.test(html))html=html.replace(/<\/body>/i,inline+instInline+v3Inline+bridge+'</body>');
  else html+=inline+instInline+v3Inline+bridge;

  document.open();document.write(html);document.close();
})().catch(err=>{
  const msg=String(err&&err.message||err).replace(/[&<>]/g,s=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[s]));
  document.body.innerHTML='<div class="box"><h2>Stock Truth v2 could not load</h2><div class="muted err">'+msg+'</div><div class="muted" style="margin-top:14px">The loader could not reach the V2 source. No browser API keys are required.</div></div>';
});
</script>
</body>
</html>
